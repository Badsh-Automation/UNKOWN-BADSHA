name: Send test push

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test push
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -H "Title: UNKOWN BADSHA test" -H "Priority: high" -H "Tags: green_circle" \
            -d "Test push OK. Signals isi tarah aayenge." "https://ntfy.sh/$NTFY_TOPIC"
