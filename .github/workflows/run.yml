name: UNKOWN BADSHA

on:
  schedule:
    - cron: "*/5 * * * *"   # 15m candle close ke baad 5 min ke andar check
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badsha
  cancel-in-progress: false

env:
  DATA_SOURCE: tradingview    # chart se exact match chahiye to: tradingview
  INTERVAL: 15m
  SYMBOLS: EURUSD,GBPUSD,USDJPY,BTCUSD,ETHUSD
  TIMEZONE: Asia/Kolkata
  SEND_MITIGATED: "0"      # sirf ENTRY/EXIT mail
  SKIP_INVALID: "1"        # toote hue box ka alert nahi

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: TradingView source (sirf jab DATA_SOURCE=tradingview)
        if: env.DATA_SOURCE == 'tradingview'
        run: pip install git+https://github.com/rongardF/tvdatafeed.git
      - name: Run indicator
        run: python indicator.py
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save state
        run: |
          git config user.name "badsha-bot"
          git config user.email "badsha-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "update state" && git push)
